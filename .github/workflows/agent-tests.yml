name: Agent package unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install --upgrade pytest
      - name: Validate shell syntax
        run: bash -n active-response/isolate.sh && bash -n scripts/install.sh
      - name: Agent unit tests
        run: python -m pytest -q tests/unit
      - name: Installer dry-run
        run: bash scripts/install.sh --dry-run
